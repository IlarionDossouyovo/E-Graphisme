<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agents | ELECTRON</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-premium: #F8E08E;
            --gold-dark: #8B6B1F;
            --black: #0A0A0A;
            --white: #FFFFFF;
            --gray: #1A1A1A;
            --gray-light: #2A2A2A;
            --electric-blue: #00B8FF;
            --neon-purple: #7A3CFF;
            --cyan: #00F0FF;
            --red: #FF6B6B;
            --green: #4CAF50;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
        }
        
        /* Access Denied */
        #access-denied {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #access-denied h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            color: var(--red);
            margin-bottom: 20px;
        }
        
        #access-denied p {
            color: #888;
            font-size: 18px;
        }
        
        /* Header */
        header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), var(--gold-premium));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo span {
            font-size: 14px;
            color: var(--gold-dark);
            font-weight: 400;
        }
        
        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .btn-gold {
            background: var(--gold);
            color: var(--black);
        }
        
        .btn-gold:hover {
            background: var(--gold-premium);
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        
        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }
        
        /* Main */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }
        
        .page-header {
            margin-bottom: 40px;
        }
        
        .page-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 42px;
            margin-bottom: 10px;
        }
        
        .page-header h1 span {
            background: linear-gradient(135deg, var(--gold), var(--electric-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .page-header p {
            color: #888;
            font-size: 16px;
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--gray-light);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-card .number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--gold);
        }
        
        .stat-card .label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        
        /* Departments */
        .departments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .department {
            background: var(--gray-light);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .department:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
        }
        
        .department-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .department-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .department-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
        }
        
        .department-desc {
            color: #888;
            font-size: 14px;
        }
        
        /* Agents */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .agent-card {
            background: var(--gray);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        
        .agent-card:hover {
            border-color: var(--electric-blue);
            box-shadow: 0 10px 40px rgba(0, 184, 255, 0.1);
        }
        
        .agent-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .agent-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
        }
        
        .agent-info h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 600;
        }
        
        .agent-info .model {
            color: #888;
            font-size: 13px;
        }
        
        .agent-desc {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        
        .agent-capabilities {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .capability {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
        }
        
        .agent-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-active {
            background: rgba(76, 175, 80, 0.2);
            color: var(--green);
        }
        
        .status-inactive {
            background: rgba(255, 107, 107, 0.2);
            color: var(--red);
        }
        
        .status-training {
            background: rgba(255, 213, 79, 0.2);
            color: #FFD54F;
        }
        
        .btn-test {
            padding: 8px 16px;
            font-size: 13px;
            background: var(--electric-blue);
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-test:hover {
            background: var(--cyan);
            transform: translateY(-2px);
        }
        
        /* Chat Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--gray);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 16px;
            line-height: 1.6;
        }
        
        .message.user {
            background: var(--electric-blue);
            color: var(--white);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant {
            background: var(--gray-light);
            color: var(--white);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .chat-input {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--black);
            color: var(--white);
            font-size: 14px;
        }
        
        .chat-input input:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--gray);
            padding: 15px 20px;
            border-radius: 12px;
            border-left: 4px solid var(--green);
            display: none;
            z-index: 10000;
        }
        
        .toast.error {
            border-left-color: var(--red);
        }
        
        .toast.show {
            display: block;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Access Denied -->
    <div id="access-denied">
        <h1>🚫 Accès Refusé</h1>
        <p>Cette page est réservés au fondateur de l'entreprise ELECTRON</p>
    </div>
    
    <!-- Header -->
    <header>
        <div class="logo">
            ⚡ ELECTRON <span>AI Agents</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="refreshAgents()">🔄 Actualiser</button>
            <button class="btn btn-gold" onclick="exportConfig()">📤 Exporter Config</button>
        </div>
    </header>
    
    <!-- Main -->
    <main>
        <div class="page-header">
            <h1>Gestion des <span>Agents IA</span></h1>
            <p>Centralisation et contrôle de tous les agents IA de l'entreprise ELECTRON</p>
        </div>
        
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="stat-total">7</div>
                <div class="label">Agents IA</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-active">7</div>
                <div class="label">Actifs</div>
            </div>
            <div class="stat-card">
                <div class="number">7</div>
                <div class="label">Départements</div>
            </div>
            <div class="stat-card">
                <div class="number" id="stat-models">4</div>
                <div class="label">Modèles Ollama</div>
            </div>
        </div>
        
        <!-- Departments -->
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin-bottom: 20px;">Départements</h2>
        <div class="departments" id="departments">
            <!-- Loaded dynamically -->
        </div>
        
        <!-- Agents -->
        <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; margin-bottom: 20px;">Agents IA</h2>
        <div class="agents-grid" id="agents-grid">
            <!-- Loaded dynamically -->
        </div>
    </main>
    
    <!-- Chat Modal -->
    <div class="modal" id="chat-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="chat-agent-name">Test Agent</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Tapez votre message..." onkeypress="handleChatKeypress(event)">
                <button class="btn btn-gold" onclick="sendMessage()">Envoyer</button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <script>
        // =============================================
        // CONFIGURATION - À MODIFIER PAR LE FONDATEUR
        // =============================================
        const FOUNDER_EMAIL = 'founder@electron.com'; // Email du fondateur
        const FOUNDER_KEY = 'founder_2026_electron'; // Clé secrète
        
        // Modèles Ollama disponibles sur la machine
        const OLLAMA_MODELS = [
            { name: 'llama3.2:latest', size: '2.0Go' },
            { name: 'llama3.1:8b', size: '4.9Go' },
            { name: 'qwen2.5-coder:7b', size: '4.7Go' },
            { name: 'nomic-embed-text:latest', size: '274Mo' },
            { name: 'phi3:mini', size: '2.2Go' }
        ];
        
        // Départements
        const DEPARTMENTS = [
            { id: 1, name: 'Direction', slug: 'direction', description: 'Direction générale et stratégie', color: '#D4AF37', icon: '👑' },
            { id: 2, name: 'Design Graphique', slug: 'design', description: 'Conception visuelle et branding', color: '#00B8FF', icon: '🎨' },
            { id: 3, name: 'Développement', slug: 'development', description: 'Développement web et applications', color: '#7A3CFF', icon: '💻' },
            { id: 4, name: 'Marketing', slug: 'marketing', description: 'Marketing digital et communication', color: '#00F0FF', icon: '📢' },
            { id: 5, name: 'Production Vidéo', slug: 'production', description: 'Production vidéo et motion design', color: '#FFD54F', icon: '🎬' },
            { id: 6, name: 'Intelligence Artificielle', slug: 'ai', description: 'Recherche et développement IA', color: '#FF6B6B', icon: '🤖' },
            { id: 7, name: 'Support Client', slug: 'support', description: 'Support et relation client', color: '#4CAF50', icon: '🎧' }
        ];
        
        // Agents IA
        const AI_AGENTS = [
            {
                id: 1,
                name: 'ELECTRON Director',
                slug: 'director',
                model: 'llama3.2:latest',
                department: 1,
                description: 'Assistant de direction stratégique pour la prise de décision',
                capabilities: ['Stratégie', 'Analyse', 'Planification', 'Décision'],
                instructions: 'Vous êtes ELECTRON Director, l\'assistant IA de direction de l\'entreprise ELECTRON. Vous aidez à la prise de décision stratégique, l\'analyse de marché et la planification à long terme.',
                status: 'active'
            },
            {
                id: 2,
                name: 'ELECTRON Designer',
                slug: 'designer',
                model: 'llama3.2:latest',
                department: 2,
                description: 'Assistant de conception graphique et design',
                capabilities: ['Création logo', 'Charte graphique', 'Design UI', 'Branding', 'Conseil créatif'],
                instructions: 'Vous êtes ELECTRON Designer, l\'expert en design de l\'entreprise. Vous aidez à créer des identités visuelles, des logos, des chartes graphiques et des designs UI/UX.',
                status: 'active'
            },
            {
                id: 3,
                name: 'ELECTRON Developer',
                slug: 'developer',
                model: 'qwen2.5-coder:7b',
                department: 3,
                description: 'Assistant de développement et programmation',
                capabilities: ['Code', 'Debug', 'Architecture', 'Refactoring', 'Documentation'],
                instructions: 'Vous êtes ELECTRON Developer, l\'expert en développement. Vous aidez à écrire du code, résoudre des bugs, créer des architectures et documenter les projets.',
                status: 'active'
            },
            {
                id: 4,
                name: 'ELECTRON Marketer',
                slug: 'marketer',
                model: 'llama3.1:8b',
                department: 4,
                description: 'Assistant marketing et communication',
                capabilities: ['SEO', 'Content Marketing', 'Social Media', 'Email Marketing', 'Analytics'],
                instructions: 'Vous êtes ELECTRON Marketer, l\'expert en marketing. Vous aidez à créer des stratégies marketing, du contenu, et analyser les performances.',
                status: 'active'
            },
            {
                id: 5,
                name: 'ELECTRON Producer',
                slug: 'producer',
                model: 'llama3.2:latest',
                department: 5,
                description: 'Assistant de production vidéo',
                capabilities: ['Script', 'Storyboard', 'Montage', 'Motion Design', 'Effects'],
                instructions: 'Vous êtes ELECTRON Producer, l\'expert en production vidéo. Vous aidez à créer des scripts, storyboards, plans de montage et effets visuels.',
                status: 'active'
            },
            {
                id: 6,
                name: 'ELECTRON AI',
                slug: 'ai-research',
                model: 'llama3.2:latest',
                department: 6,
                description: 'Assistant de recherche IA',
                capabilities: ['Prompt Engineering', 'Fine-tuning', 'Model Training', 'Data Analysis'],
                instructions: 'Vous êtes ELECTRON AI, l\'expert en intelligence artificielle. Vous aidez à créer des prompts, fine-tuner des modèles et analyser des données.',
                status: 'active'
            },
            {
                id: 7,
                name: 'ELECTRON Support',
                slug: 'support',
                model: 'llama3.1:8b',
                department: 7,
                description: 'Assistant support client',
                capabilities: ['Support technique', 'FAQ', 'Troubleshooting', 'Relation client'],
                instructions: 'Vous êtes ELECTRON Support, l\'expert en support client. Vous aidez à répondre aux questions, résoudre les problèmes et maintenir la relation client.',
                status: 'active'
            }
        ];
        
        // =============================================
        // VÉRIFICATION D'ACCÈS
        // =============================================
        let isFounder = false;
        
        function checkAccess() {
            const email = prompt('Entrez votre email de fondateur:');
            const key = prompt('Entrez votre clé secrète:');
            
            if (email === FOUNDER_EMAIL && key === FOUNDER_KEY) {
                isFounder = true;
                showToast('✓ Accès autorisé');
                return true;
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                return false;
            }
        }
        
        // =============================================
        // RENDERING
        // =============================================
        function renderDepartments() {
            const container = document.getElementById('departments');
            container.innerHTML = DEPARTMENTS.map(dept => `
                <div class="department">
                    <div class="department-header">
                        <div class="department-icon" style="background: ${dept.color}20; color: ${dept.color}">
                            ${dept.icon}
                        </div>
                        <div>
                            <div class="department-name">${dept.name}</div>
                            <div class="department-desc">${dept.description}</div>
                        </div>
                    </div>
                    <div style="color: #888; font-size: 13px;">
                        ${AI_AGENTS.filter(a => a.department === dept.id).length} agent(s)
                    </div>
                </div>
            `).join('');
        }
        
        function renderAgents() {
            const container = document.getElementById('agents-grid');
            container.innerHTML = AI_AGENTS.map(agent => {
                const dept = DEPARTMENTS.find(d => d.id === agent.department);
                return `
                <div class="agent-card">
                    <div class="agent-header">
                        <div class="agent-avatar" style="background: ${dept.color}">
                            ${agent.name.split(' ').map(w => w[0]).join('')}
                        </div>
                        <div class="agent-info">
                            <h3>${agent.name}</h3>
                            <div class="model">${agent.model}</div>
                        </div>
                    </div>
                    <div class="agent-desc">${agent.description}</div>
                    <div class="agent-capabilities">
                        ${agent.capabilities.map(c => `<span class="capability">${c}</span>`).join('')}
                    </div>
                    <div class="agent-status">
                        <span class="status-badge status-${agent.status}">${agent.status}</span>
                        <button class="btn-test" onclick="testAgent(${agent.id})">Tester</button>
                    </div>
                </div>
            `;
            }).join('');
        }
        
        function updateStats() {
            document.getElementById('stat-total').textContent = AI_AGENTS.length;
            document.getElementById('stat-active').textContent = AI_AGENTS.filter(a => a.status === 'active').length;
            document.getElementById('stat-models').textContent = OLLAMA_MODELS.length;
        }
        
        // =============================================
        // CHAT AVEC OLLAMA
        // =============================================
        let currentAgent = null;
        
        async function testAgent(agentId) {
            if (!checkAccess()) return;
            
            currentAgent = AI_AGENTS.find(a => a.id === agentId);
            document.getElementById('chat-agent-name').textContent = currentAgent.name;
            document.getElementById('chat-modal').classList.add('active');
            document.getElementById('chat-messages').innerHTML = `
                <div class="message assistant">
                    <strong>${currentAgent.name}:</strong><br>
                    ${currentAgent.instructions}
                </div>
            `;
        }
        
        function closeModal() {
            document.getElementById('chat-modal').classList.remove('active');
            currentAgent = null;
        }
        
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !currentAgent) return;
            
            // Add user message
            const messagesDiv = document.getElementById('chat-messages');
            messagesDiv.innerHTML += `<div class="message user">${message}</div>`;
            messagesDiv.innerHTML += `<div class="message assistant"><span class="loading"></span></div>`;
            input.value = '';
            
            try {
                const response = await fetch('http://localhost:11434/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: currentAgent.model,
                        messages: [
                            { role: 'system', content: currentAgent.instructions },
                            { role: 'user', content: message }
                        ],
                        stream: false
                    })
                });
                
                const data = await response.json();
                const reply = data.message?.content || 'Erreur de réponse';
                
                // Remove loading and add response
                messagesDiv.innerHTML = messagesDiv.innerHTML.replace(
                    /<span class="loading"><\/span>/, 
                    `<strong>${currentAgent.name}:</strong><br>${reply}`
                );
            } catch (error) {
                messagesDiv.innerHTML = messagesDiv.innerHTML.replace(
                    /<span class="loading"><\/span>/, 
                    `<strong>Erreur:</strong> Impossible de连接到 Ollama. Vérifiez que Ollama est en cours d'exécution.`
                );
                showToast('Erreur de connexion Ollama', true);
            }
        }
        
        function handleChatKeypress(e) {
            if (e.key === 'Enter') sendMessage();
        }
        
        // =============================================
        // UTILITAIRES
        // =============================================
        function refreshAgents() {
            if (!checkAccess()) return;
            renderDepartments();
            renderAgents();
            updateStats();
            showToast('✓ Agents actualisés');
        }
        
        function exportConfig() {
            if (!checkAccess()) return;
            
            const config = {
                version: '1.0',
                exported_at: new Date().toISOString(),
                founder: FOUNDER_EMAIL,
                departments: DEPARTMENTS,
                agents: AI_AGENTS,
                models: OLLAMA_MODELS
            };
            
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'electron-ai-config.json';
            a.click();
            
            showToast('✓ Configuration exportée');
        }
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // =============================================
        // INITIALISATION
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            if (checkAccess()) {
                renderDepartments();
                renderAgents();
                updateStats();
            }
        });
    </script>
</body>
</html>
